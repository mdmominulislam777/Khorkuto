<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HighFy TV - Live Sports & Events</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0f19">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-[#0b0f19] text-white font-sans max-w-md mx-auto min-h-screen pb-20 border-x border-gray-800 select-none relative overflow-x-hidden">

  <!-- Header -->
  <header class="flex justify-between items-center p-4 bg-[#0b0f19] sticky top-0 z-40 border-b border-gray-800">
    <div class="flex items-center space-x-3">
      <h1 class="font-bold text-lg text-blue-500 tracking-wide">HighFy TV</h1>
    </div>
    <div class="flex items-center space-x-3 text-xs text-gray-400">
      <span class="inline-block w-2 h-2 bg-green-500 rounded-full animate-ping"></span> Live Auto Sync
    </div>
  </header>

  <!-- Video Player Modal -->
  <div id="player-container" class="hidden p-3 bg-black sticky top-[57px] z-30">
    <div class="relative w-full aspect-video bg-gray-900 rounded-lg overflow-hidden border border-gray-700">
      <video id="video" controls class="w-full h-full"></video>
      <button onclick="closePlayer()" class="absolute top-2 right-2 bg-red-600 text-white w-7 h-7 rounded-full text-xs font-bold">✕</button>
    </div>
    <p id="player-title" class="text-xs text-blue-400 mt-2 font-medium"></p>
  </div>

  <!-- Sports Category Filters -->
  <div class="flex space-x-2 p-3 overflow-x-auto text-xs font-medium no-scrollbar border-b border-gray-800/50">
    <button onclick="setCategory('all')" id="cat-all" class="bg-blue-600 text-white px-3.5 py-1.5 rounded-full whitespace-nowrap">All</button>
    <button onclick="setCategory('football')" id="cat-football" class="bg-[#131927] border border-gray-800 text-gray-300 px-3.5 py-1.5 rounded-full whitespace-nowrap">⚽ Football</button>
    <button onclick="setCategory('cricket')" id="cat-cricket" class="bg-[#131927] border border-gray-800 text-gray-300 px-3.5 py-1.5 rounded-full whitespace-nowrap">🏏 Cricket</button>
    <button onclick="setCategory('tennis')" id="cat-tennis" class="bg-[#131927] border border-gray-800 text-gray-300 px-3.5 py-1.5 rounded-full whitespace-nowrap">🎾 Tennis</button>
    <button onclick="setCategory('basketball')" id="cat-basketball" class="bg-[#131927] border border-gray-800 text-gray-300 px-3.5 py-1.5 rounded-full whitespace-nowrap">🏀 Basketball</button>
    <button onclick="setCategory('motorsports')" id="cat-motorsports" class="bg-[#131927] border border-gray-800 text-gray-300 px-3.5 py-1.5 rounded-full whitespace-nowrap">🏎️ Motorsports</button>
    <button onclick="setCategory('wwe')" id="cat-wwe" class="bg-[#131927] border border-gray-800 text-gray-300 px-3.5 py-1.5 rounded-full whitespace-nowrap">⚡ WWE</button>
  </div>

  <!-- Dynamic Match Container -->
  <div id="matches-container" class="p-3 space-y-3">
    <div class="text-center text-gray-500 text-xs py-8">Loading Live Data...</div>
  </div>

  <script>
    let matchesData = [];
    let activeCategory = 'all';

    // ১. অনলাইন JSON ফাইল থেকে ডাটা লোড করার মেথড
    async function fetchLiveMatches() {
      try {
        // এখানে আপনার GitHub Raw JSON লিঙ্ক বসাবেন
        const response = await fetch('./matches.json');
        matchesData = await response.json();
        renderMatches();
      } catch (error) {
        console.error("Error fetching match data:", error);
      }
    }

    // ২. ফিল্টারিং এবং অটো-টাইমার লজিক
    function renderMatches() {
      const container = document.getElementById('matches-container');
      const now = new Date();
      let htmlContent = '';

      const filtered = matchesData.filter(m => activeCategory === 'all' || m.category === activeCategory);

      if(filtered.length === 0) {
        container.innerHTML = `<div class="text-center text-gray-500 text-xs py-8">No live or upcoming events for this category.</div>`;
        return;
      }

      filtered.forEach(match => {
        const start = new Date(match.startTime);
        const end = new Date(match.endTime);
        
        let statusBadge = '';
        let isLive = false;

        if (now >= start && now <= end) {
          isLive = true;
          statusBadge = `<span class="bg-red-600 text-white text-[9px] px-2 py-0.5 rounded-full font-bold animate-pulse">● LIVE NOW</span>`;
        } else if (now < start) {
          const diffMs = start - now;
          const mins = Math.floor(diffMs / (1000 * 60));
          statusBadge = `<span class="bg-blue-900/60 text-blue-300 text-[10px] px-2 py-0.5 rounded-full font-medium">Starts in ${mins}m</span>`;
        } else {
          statusBadge = `<span class="bg-gray-800 text-gray-400 text-[9px] px-2 py-0.5 rounded-full">FINISHED</span>`;
        }

        // রেন্ডার চ্যানেল বাটনসমূহ
        let channelsHtml = '';
        if (match.channels && match.channels.length > 0) {
          channelsHtml = `<div class="mt-3 pt-2 border-t border-gray-800/80 flex flex-wrap gap-1.5 justify-center">`;
          match.channels.forEach(ch => {
            channelsHtml += `
              <button onclick="playStream('${ch.url}', '${match.title} - ${ch.name}')" 
                      class="bg-blue-950/80 hover:bg-blue-600 text-blue-200 hover:text-white border border-blue-800/50 px-2.5 py-1 rounded-md text-[10px] transition font-medium">
                📺 ${ch.name}
              </button>`;
          });
          channelsHtml += `</div>`;
        }

        htmlContent += `
          <div class="bg-[#131927] border ${isLive ? 'border-red-900/50 shadow-lg shadow-red-950/20' : 'border-gray-800'} rounded-xl p-3 transition">
            <div class="text-center text-[11px] text-gray-400 mb-2 font-medium flex justify-between items-center px-1">
              <span><i class="fa-solid ${match.icon} mr-1"></i> ${match.title}</span>
              ${statusBadge}
            </div>
            
            <div class="flex justify-between items-center px-2 py-1">
              <div class="flex flex-col items-center w-20">
                <img src="${match.flag1}" class="w-8 h-8 rounded-full object-cover border border-gray-600">
                <span class="text-xs font-semibold mt-1 text-center truncate w-full">${match.team1}</span>
              </div>
              <div class="text-center text-xs font-bold text-gray-500">VS</div>
              <div class="flex flex-col items-center w-20">
                <img src="${match.flag2}" class="w-8 h-8 rounded-full object-cover border border-gray-600">
                <span class="text-xs font-semibold mt-1 text-center truncate w-full">${match.team2}</span>
              </div>
            </div>

            ${channelsHtml}
          </div>
        `;
      });

      container.innerHTML = htmlContent;
    }

    // ক্যাটাগরি সেট করার ফাংশন
    function setCategory(cat) {
      activeCategory = cat;
      const categories = ['all', 'football', 'cricket', 'tennis', 'basketball', 'motorsports', 'wwe'];
      categories.forEach(c => {
        const btn = document.getElementById(`cat-${c}`);
        if(btn) {
          if (c === cat) {
            btn.className = "bg-blue-600 text-white px-3.5 py-1.5 rounded-full whitespace-nowrap";
          } else {
            btn.className = "bg-[#131927] border border-gray-800 text-gray-300 px-3.5 py-1.5 rounded-full whitespace-nowrap";
          }
        }
      });
      renderMatches();
    }

    // স্ট্রিমিং প্লেয়ার
    function playStream(url, title) {
      const container = document.getElementById('player-container');
      const video = document.getElementById('video');
      document.getElementById('player-title').innerText = "Playing: " + title;
      container.classList.remove('hidden');

      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play();
      }
    }

    function closePlayer() {
      document.getElementById('video').pause();
      document.getElementById('player-container').classList.add('hidden');
    }

    // ৩০ সেকেন্ড পর পর স্বয়ংক্রিয় ডাটা রিফ্রেশ (Auto Sync)
    fetchLiveMatches();
    setInterval(fetchLiveMatches, 30000);
    setInterval(renderMatches, 10000); // টাইমার রিফ্রেশ
  </script>
</body>
</html>
